<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Calculate position size, risk, and stop loss for trading" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PositionLab" />
  <meta name="application-name" content="PositionLab" />
  <link rel="manifest" href="manifest.json?v=positionlab-v13" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>PositionLab | Trading Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app">
    <header>
      <div class="header-top-row">
        <h1>Trading Calculator</h1>
        <a href="./beta/" class="beta-switch-badge">🚀 Open PositionLab</a>
      </div>
      <nav>
        <button class="tab active" data-tab="position">Position Size</button>
        <button class="tab" data-tab="risk">Risk</button>
        <button class="tab" data-tab="stoploss">Stop Loss</button>
      </nav>
    </header>

    <main id="content">
      <!-- Dynamic content will render here -->
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker registered'))
          .catch((err) => console.log('Service Worker registration note:', err));
      });
    }
  </script>
</body>
</html>
