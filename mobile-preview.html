<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Preview — Beta Trading Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 16px 20px;
    }
    header {
      text-align: center;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
    }
    .device-switcher {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      justify-content: center;
    }
    .btn-dev {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-dev.active, .btn-dev:hover {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }
    .phone-container {
      position: relative;
      background: #000;
      padding: 10px;
      border-radius: 44px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(255, 255, 255, 0.12);
      margin-top: 4px;
      transform: scale(0.82);
      transform-origin: top center;
    }
    .phone-screen {
      position: relative;
      width: 390px;
      height: 844px;
      background: #fff;
      border-radius: 36px;
      overflow: hidden;
      border: 1px solid #222;
    }
    .notch {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 24px;
      background: #000;
      border-radius: 20px;
      z-index: 1000;
      pointer-events: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <h1>📱 Mobile Hybrid UI Preview</h1>
    <p>Testing Stepped Tabs (Setup / Entries / Targets) &amp; Sticky Live Thumb HUD</p>
    <div class="device-switcher">
      <button class="btn-dev active" onclick="setDevice(390, 844, this)">iPhone 14/15 (390×844)</button>
      <button class="btn-dev" onclick="setDevice(412, 915, this)">Pixel 7 (412×915)</button>
      <button class="btn-dev" onclick="setDevice(360, 780, this)">Compact (360×780)</button>
    </div>
  </header>

  <div class="phone-container">
    <div class="notch"></div>
    <div class="phone-screen" id="screen">
      <iframe id="calcFrame" src="/beta/?t=fresh-v7"></iframe>
    </div>
  </div>

  <script>
    function setDevice(w, h, btn) {
      const screen = document.getElementById('screen');
      screen.style.width = w + 'px';
      screen.style.height = h + 'px';
      document.querySelectorAll('.btn-dev').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
